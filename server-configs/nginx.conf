upstream cloud_storage_app {
    server unix:/opt/cloud_storage/backend/cloud_storage.sock fail_timeout=0;
}

server {
    listen 80;
    server_name 194.67.124.178;  
    
    # Логи
    access_log /opt/cloud_storage/logs/nginx-access.log;
    error_log /opt/cloud_storage/logs/nginx-error.log;
    
    # Обслуживание фронтенда
    location / {
        root /opt/cloud_storage/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API endpoints
    location /api/ {
        proxy_pass http://cloud_storage_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Статические файлы Django
    location /static/ {
        alias /opt/cloud_storage/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Медиа файлы
    location /media/ {
        alias /opt/cloud_storage/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Django Admin статика
    location /admin/static/ {
        alias /opt/cloud_storage/static/admin/;
    }
    
    # Health check endpoint
    location /health/ {
        proxy_pass http://cloud_storage_app;
        access_log off;
    }
}
