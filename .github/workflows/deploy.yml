name: Deploy Cloud Storage

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H 194.67.124.178 >> ~/.ssh/known_hosts 2>/dev/null

    - name: Deploy to Server
      run: |
        set -e
        
        # Подготавливаем команды для выполнения
        COMMANDS="
        set -e
        echo '=== Starting deployment ==='
        cd /opt/cloud_storage
        echo '=== Updating code ==='
        git pull origin server-version
        cd backend
        echo '=== Setting up environment ==='
        if [ -d 'venv' ]; then
          source venv/bin/activate
        else
          python3 -m venv venv
          source venv/bin/activate
        fi
        pip install -r requirements.txt
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        echo '=== Restarting services ==='
        sudo systemctl restart gunicorn-cloud-storage
        sudo systemctl reload nginx
        deactivate
        echo '=== Deployment completed successfully! ==='
        echo '✅ Server updated and running'
        "
        
        # Выполняем команды на сервере
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no mikhail@194.67.124.178 "$COMMANDS"
