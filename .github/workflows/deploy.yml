name: Deploy to VPS

on:
  push:
    branches: [ server-version ]
  pull_request:
    branches: [ server-version ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,194.67.124.178'
      DATABASE_URL: sqlite:///db.sqlite3  # Use SQLite for tests to avoid Postgres setup
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django checks
      run: |
        cd backend
        python manage.py check --deploy
        python manage.py makemigrations --check --dry-run
    
    - name: Run tests (if any)
      run: |
        cd backend
        python manage.py test --noinput || echo "No tests found or tests failed"

  deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/server-version'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Add server to known_hosts
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        
        # SSH config for easier access
        cat >> ~/.ssh/config << EOF
        Host cloud-storage-server
          HostName ${{ secrets.SERVER_IP }}
          User ${{ secrets.SERVER_USERNAME }}
          IdentityFile ~/.ssh/id_rsa
          StrictHostKeyChecking no
        EOF
    
    - name: Check server connectivity
      run: |
        echo "Testing SSH connection to server..."
        ssh cloud-storage-server "echo 'SSH connection successful!'"
    
    - name: Prepare backend deployment
      run: |
        # Create production .env file
        cat > backend/.env.production << EOF
        DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_DEBUG=False
        DJANGO_ALLOWED_HOSTS=194.67.124.178,localhost
        DJANGO_CSRF_TRUSTED_ORIGINS=http://194.67.124.178
        
        DB_ENGINE=django.db.backends.postgresql
        DB_NAME=cloud_storage
        DB_USER=cloud_user
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_HOST=localhost
        DB_PORT=5432
        
        CORS_ALLOWED_ORIGINS=http://194.67.124.178
        CORS_ALLOW_CREDENTIALS=True
        
        MEDIA_ROOT=/opt/cloud_storage/media
        MAX_UPLOAD_SIZE=52428800
        
        # Security settings for production
        SECURE_HSTS_SECONDS=31536000
        SECURE_SSL_REDIRECT=False
        SESSION_COOKIE_SECURE=False
        CSRF_COOKIE_SECURE=False
        EOF
        
        # Create archive for backend
        tar -czf backend.tar.gz backend/
    
    - name: Deploy backend to server
      run: |
        echo "Deploying backend to server..."
        
        # Create directory structure on server if not exists
        ssh cloud-storage-server "mkdir -p /opt/cloud_storage/{backend,frontend,logs,media,static,deploy-scripts,server-configs}"
        
        # Copy backend files
        scp backend.tar.gz cloud-storage-server:/tmp/
        
        # Extract and deploy
        ssh cloud-storage-server << 'EOF'
        set -e
        
        cd /opt/cloud_storage
        
        # Backup current backend if exists
        if [ -d "backend" ] && [ -d "backend/venv" ]; then
          echo "Backing up current backend..."
          tar -czf backend-backup-$(date +%Y%m%d_%H%M%S).tar.gz backend/
        fi
        
        # Extract new backend
        echo "Extracting new backend..."
        rm -rf backend_new
        mkdir backend_new
        tar -xzf /tmp/backend.tar.gz -C backend_new --strip-components=1
        
        # Move to production location
        rm -rf backend_old
        mv backend backend_old 2>/dev/null || true
        mv backend_new backend
        
        # Copy production env file
        cp backend/.env.production backend/.env 2>/dev/null || true
        
        echo "Backend files deployed successfully!"
        EOF
    
    - name: Run backend deployment script
      run: |
        echo "Running backend deployment script..."
        
        # First, ensure deployment scripts exist on server
        scp -r deploy-scripts/* cloud-storage-server:/opt/cloud_storage/deploy-scripts/
        
        # Make scripts executable
        ssh cloud-storage-server "chmod +x /opt/cloud_storage/deploy-scripts/*.sh"
        
        # Run backend deployment
        ssh cloud-storage-server "bash /opt/cloud_storage/deploy-scripts/deploy-backend.sh"
    
    - name: Build and deploy frontend
      run: |
        echo "Building frontend..."
        
        # Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
        
        # Install and build frontend
        cd frontend
        npm ci
        npm run build
        
        # Create frontend archive
        tar -czf frontend-build.tar.gz build/
        
        # Deploy to server
        scp frontend-build.tar.gz cloud-storage-server:/tmp/
        
        ssh cloud-storage-server << 'EOF'
        set -e
        
        cd /opt/cloud_storage/frontend
        
        # Extract frontend build
        rm -rf build_old
        mv build build_old 2>/dev/null || true
        tar -xzf /tmp/frontend-build.tar.gz
        
        echo "Frontend deployed successfully!"
        EOF
    
    - name: Configure server services
      run: |
        echo "Configuring server services..."
        
        # Copy server configs
        scp -r server-configs/* cloud-storage-server:/opt/cloud_storage/server-configs/
        
        # Configure Nginx
        ssh cloud-storage-server << 'EOF'
        set -e
        
        echo "Configuring Nginx..."
        
        # Install Nginx if not installed
        if ! command -v nginx &> /dev/null; then
          apt update && apt install -y nginx
        fi
        
        # Copy Nginx config
        cp /opt/cloud_storage/server-configs/nginx.conf /etc/nginx/sites-available/cloud_storage
        
        # Enable site
        ln -sf /etc/nginx/sites-available/cloud_storage /etc/nginx/sites-enabled/
        rm -f /etc/nginx/sites-enabled/default
        
        # Test and restart Nginx
        nginx -t
        systemctl restart nginx
        
        echo "Nginx configured successfully!"
        EOF
        
        # Configure Gunicorn
        ssh cloud-storage-server << 'EOF'
        set -e
        
        echo "Configuring Gunicorn..."
        
        # Copy Gunicorn service file
        cp /opt/cloud_storage/server-configs/gunicorn.service /etc/systemd/system/
        
        # Reload systemd and enable service
        systemctl daemon-reload
        systemctl enable gunicorn
        
        echo "Gunicorn service configured!"
        EOF
    
    - name: Start and verify services
      run: |
        echo "Starting services..."
        
        ssh cloud-storage-server << 'EOF'
        set -e
        
        # Start Gunicorn
        systemctl restart gunicorn
        
        # Give services time to start
        sleep 5
        
        # Check service status
        echo "=== Service Status ==="
        systemctl status nginx --no-pager | head -20
        echo ""
        systemctl status gunicorn --no-pager | head -20
        
        # Verify application is running
        echo ""
        echo "=== Application Check ==="
        curl -f http://localhost/ || echo "Frontend check failed (might be normal during first setup)"
        curl -f http://localhost/api/ || echo "API check failed (might require authentication)"
        
        echo "Services started successfully!"
        EOF
    
    - name: Final verification
      run: |
        echo "=== Deployment Summary ==="
        echo "✅ Backend: Deployed to /opt/cloud_storage/backend"
        echo "✅ Frontend: Built and deployed to /opt/cloud_storage/frontend/build"
        echo "✅ Nginx: Configured and running"
        echo "✅ Gunicorn: Configured and running"
        echo ""
        echo "🌐 Application URL: http://${{ secrets.SERVER_IP }}"
        echo "🔧 Django Admin: http://${{ secrets.SERVER_IP }}/admin/"
        echo "📊 API Endpoint: http://${{ secrets.SERVER_IP }}/api/"
        echo ""
        echo "Next steps:"
        echo "1. Check Django admin at http://${{ secrets.SERVER_IP }}/admin/"
        echo "2. Create superuser if needed: ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} 'cd /opt/cloud_storage/backend && source venv/bin/activate && python manage.py createsuperuser'"
        echo "3. Test file upload functionality"
    
    - name: Cleanup temporary files
      if: always()
      run: |
        rm -f ~/.ssh/id_rsa
        rm -f backend.tar.gz frontend-build.tar.gz 2>/dev/null || true