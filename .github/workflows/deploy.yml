name: Deploy Cloud Storage

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 194.67.124.178 >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no mikhail@194.67.124.178 '
            set -e
            cd /opt/cloud_storage
            echo "=== Updating code ==="
            git pull origin server-version
            cd backend
            echo "=== Activating environment ==="
            source venv/bin/activate
            echo "=== Installing dependencies ==="
            pip install -r requirements.txt
            echo "=== Applying migrations ==="
            python manage.py migrate --noinput
            echo "=== Collecting static files ==="
            python manage.py collectstatic --noinput
            deactivate
            echo "=== Restarting services ==="
            sudo /usr/bin/systemctl restart gunicorn-cloud-storage
            sudo /usr/bin/systemctl reload nginx
            echo "✅ Deployment completed successfully!"
          '
