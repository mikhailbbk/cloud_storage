name: Deploy to VPS

on:
  push:
    branches: [ server-version ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,194.67.124.178'
      DJANGO_CSRF_TRUSTED_ORIGINS: 'http://localhost,http://127.0.0.1'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django checks
      run: |
        cd backend
        python manage.py check --deploy || echo "Deploy check completed with warnings"
        python manage.py makemigrations --check --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/server-version'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Create SSH config
        cat >> ~/.ssh/config << EOF
        Host cloud-storage
          HostName ${{ secrets.SERVER_IP }}
          User ${{ secrets.SERVER_USERNAME }}
          IdentityFile ~/.ssh/id_rsa
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
    
    - name: Test SSH connection
      run: |
        echo "Testing SSH connection..."
        ssh -v cloud-storage "echo 'SSH connection successful!'" || echo "SSH test failed"
    
    - name: Prepare deployment files
      run: |
        # Create backend archive
        tar -czf backend-deploy.tar.gz backend/
        
        # Create minimal .env for production
        cat > .env.production << EOF
        DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_DEBUG=False
        DJANGO_ALLOWED_HOSTS=194.67.124.178,localhost
        DJANGO_CSRF_TRUSTED_ORIGINS=http://194.67.124.178
        
        DB_ENGINE=django.db.backends.postgresql
        DB_NAME=cloud_storage
        DB_USER=cloud_user
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_HOST=localhost
        DB_PORT=5432
        
        CORS_ALLOWED_ORIGINS=http://194.67.124.178
        CORS_ALLOW_CREDENTIALS=True
        
        MEDIA_ROOT=/opt/cloud_storage/media
        MAX_UPLOAD_SIZE=52428800
        EOF
    
    - name: Deploy to server
      run: |
        # Copy files to server
        scp backend-deploy.tar.gz cloud-storage:/tmp/
        scp .env.production cloud-storage:/tmp/
        scp -r deploy-scripts/ cloud-storage:/tmp/
        scp -r server-configs/ cloud-storage:/tmp/
        
        # Execute remote deployment script
        ssh cloud-storage << 'EOF'
        set -e
        
        echo "=== Starting deployment ==="
        
        # Create directories
        mkdir -p /opt/cloud_storage/{backend,frontend,logs,media,static,scripts,configs}
        
        # Install system packages
        echo "Installing required packages..."
        apt update && apt install -y python3 python3-pip python3-venv nginx postgresql postgresql-contrib
        
        # Setup PostgreSQL
        echo "Setting up PostgreSQL..."
        sudo -u postgres psql -c "CREATE DATABASE cloud_storage;" 2>/dev/null || true
        sudo -u postgres psql -c "CREATE USER cloud_user WITH PASSWORD '${{ secrets.DB_PASSWORD }}';" 2>/dev/null || true
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cloud_storage TO cloud_user;" 2>/dev/null || true
        
        # Extract backend
        echo "Deploying backend..."
        cd /opt/cloud_storage
        tar -xzf /tmp/backend-deploy.tar.gz -C backend --strip-components=1
        cp /tmp/.env.production backend/.env
        
        # Setup Python virtual environment
        cd backend
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        
        # Apply migrations
        python manage.py migrate --noinput
        
        # Collect static files
        python manage.py collectstatic --noinput --clear
        
        # Setup frontend
        echo "Setting up frontend placeholder..."
        echo "<html><body><h1>Cloud Storage Frontend</h1><p>Frontend will be deployed separately</p></body></html>" > /opt/cloud_storage/frontend/build/index.html
        
        # Copy configs and scripts
        cp -r /tmp/deploy-scripts/* /opt/cloud_storage/scripts/
        cp -r /tmp/server-configs/* /opt/cloud_storage/configs/
        chmod +x /opt/cloud_storage/scripts/*.sh
        
        echo "=== Deployment completed ==="
        EOF
    
    - name: Configure services
      run: |
        ssh cloud-storage << 'EOF'
        set -e
        
        # Configure Nginx
        cp /opt/cloud_storage/configs/nginx.conf /etc/nginx/sites-available/cloud_storage
        ln -sf /etc/nginx/sites-available/cloud_storage /etc/nginx/sites-enabled/
        rm -f /etc/nginx/sites-enabled/default
        
        # Test Nginx config
        nginx -t
        
        # Configure Gunicorn
        cp /opt/cloud_storage/configs/gunicorn.service /etc/systemd/system/
        systemctl daemon-reload
        systemctl enable gunicorn
        
        # Restart services
        systemctl restart nginx
        systemctl restart gunicorn
        
        echo "Services configured and started"
        EOF
    
    - name: Verify deployment
      run: |
        echo "=== Verification ==="
        echo "Server: http://${{ secrets.SERVER_IP }}"
        echo "API: http://${{ secrets.SERVER_IP }}/api/"
        echo "Admin: http://${{ secrets.SERVER_IP }}/admin/"
        
        # Quick health check
        ssh cloud-storage "curl -f http://localhost:80/ || echo 'Frontend check'"
        ssh cloud-storage "curl -f http://localhost:80/api/ || echo 'API endpoint check'"

    - name: Cleanup
      if: always()
      run: |
        rm -f ~/.ssh/id_rsa
        rm -f backend-deploy.tar.gz .env.production