name: Deploy Cloud Storage Correct

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        # Save SSH key
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Add server to known_hosts
        ssh-keyscan -H 194.67.124.178 >> ~/.ssh/known_hosts
        
        # Execute deployment CORRECTLY
        ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            mikhail@194.67.124.heredocument
          
          echo '🚀 Starting deployment...'
          
          # 1. FIRST go to backend directory
          cd /opt/cloud_storage/backend
          
          # 2. THEN activate virtual environment
          source venv/bin/activate
          
          # 3. NOW install dependencies
          echo 'Installing dependencies...'
          pip install -r requirements.txt
          
          # 4. Django operations
          echo 'Running Django operations...'
          python manage.py collectstatic --noinput
          python manage.py migrate --noinput
          
          # 5. Restart services
          echo 'Restarting services...'
          sudo systemctl restart cloud-storage.service
          sudo systemctl reload nginx
          
          echo '✅ Deployment completed!'
          echo 'Time: \$(date)'
heredocument
