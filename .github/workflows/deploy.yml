name: Deploy Cloud Storage

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Add server to known_hosts
        ssh-keyscan -H 194.67.124.178 >> ~/.ssh/known_hosts 2>/dev/null

    - name: Deploy to Server
      run: |
        set -e  # Exit on error
        
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 mikhail@194.67.124.178 << 'DEPLOY_SCRIPT'
          set -e
          echo "=== Starting deployment ==="
          
          # Go to project directory
          cd /opt/cloud_storage
          
          # Update code
          echo "=== Updating code from Git ==="
          git fetch origin
          git checkout server-version
          git pull origin server-version
          
          # Setup backend
          echo "=== Setting up backend ==="
          cd backend
          
          # Activate virtual environment
          if [ -d "venv" ]; then
            echo "Virtual environment exists"
          else
            echo "Creating virtual environment..."
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          
          # Install dependencies
          echo "=== Installing dependencies ==="
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Apply migrations
          echo "=== Applying database migrations ==="
          python manage.py migrate --noinput
          
          # Collect static files
          echo "=== Collecting static files ==="
          python manage.py collectstatic --noinput --clear
          
          # Restart services
          echo "=== Restarting services ==="
          sudo systemctl restart gunicorn-cloud-storage || echo "Gunicorn service not found or failed to restart"
          sudo systemctl reload nginx || echo "Nginx reload failed"
          
          deactivate
          
          echo "=== Deployment completed successfully! ==="
          echo "✅ Server is updated and running"
DEPLOY_SCRIPT
