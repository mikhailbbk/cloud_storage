name: Deploy Cloud Storage

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host target" >> ~/.ssh/config
          echo "  HostName 194.67.124.178" >> ~/.ssh/config
          echo "  User mikhail" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          ssh-keyscan 194.67.124.178 >> ~/.ssh/known_hosts
      
      - name: Deploy
        run: |
          ssh target "
            cd /opt/cloud_storage
            git pull origin server-version
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt 2>&1 | tail -5
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput 2>&1 | tail -2
            deactivate
            echo 'Services will be restarted via script...'
            /usr/local/bin/restart-cloud-app
            echo 'Deployment done!'
          "
