name: Deploy Cloud Storage

on:
  push:
    branches: [ server-version ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 194.67.124.178
          username: mikhail
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # ОБНОВЛЯЕМ КОД И ЗАВИСИМОСТИ
            cd /opt/cloud_storage
            git pull origin server-version
            
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            deactivate
            
            # ПРОБУЕМ ПЕРЕЗАПУСТИТЬ СЛУЖБЫ (если не получится - не страшно)
            sudo systemctl restart gunicorn-cloud-storage 2>/dev/null || echo "Gunicorn restart skipped"
            sudo systemctl reload nginx 2>/dev/null || echo "Nginx reload skipped"
            
            echo "✅ Code deployed! If services need restart, run manually:"
            echo "sudo systemctl restart gunicorn-cloud-storage"
            echo "sudo systemctl reload nginx"
